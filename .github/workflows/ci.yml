name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - run: npm ci
      - name: npm audit (reporte)
        run: npm audit --audit-level=high --json > audit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
      - name: Fallar si hay high/critical
        run: npm audit --audit-level=high

  scan:
      name: gitleaks
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Escaneo completo del historial con Gitleaks
          uses: docker://zricethezav/gitleaks:latest
          with:
            args: detect -v --source /github/workspace

  trivy:
      runs-on: ubuntu-22.04
      permissions:
        contents: read
        security-events: write
      steps:
        - uses: actions/checkout@v4
        - uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: 'fs'
            scan-ref: '.'
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'HIGH,CRITICAL'
        - uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: 'trivy-results.sarif'
